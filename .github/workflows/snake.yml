# Generates the contribution-grid snake shown in README.md.
#
# The SVGs are published to the `output` branch (NOT to main) so the README can
# hot-link them via raw.githubusercontent.com without the repo carrying a
# regenerated binary on every run. Two variants are produced so the README's
# <picture> element can follow the viewer's light/dark colour scheme.
#
# First run must be triggered manually: Actions > "Generate contribution snake"
# > "Run workflow". Until then the raw URLs in README.md return 404.
name: Generate contribution snake

on:
  schedule:
    # Every 6 hours; contribution data changes often enough to be worth it.
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          # Resolves to the repo owner (syedprogg) rather than being hardcoded,
          # so a fork or a rename keeps working.
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
